# -----------------------------------------------------------------------------
# Release workflow for deployment to GitHub Pages
#
# Properties:
# - Trigger: manual (workflow_dispatch) or on release publication (release: published)
# - Source: local directory "www/"
# - Target: GitHub Pages of this repository
#
# IMPORTANT:
# - Repository settings → Pages → Source must be set to "GitHub Actions"
# - A custom domain is configured in the Pages settings, not via a CNAME file
# -----------------------------------------------------------------------------

name: Deploy to GitHub Pages

on:
  # Manual start via GitHub Actions UI
  workflow_dispatch:
  # Automatic start when a release is published
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    # GitHub-hosted Linux runner
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Opt into Node.js 24 for actions
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # -----------------------------------------------------------------------
      # Check out repository
      # -----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Safety check: source directory exists
      # -----------------------------------------------------------------------
      - name: Validate source directory (www)
        run: |
          if [ ! -d "www" ]; then
            echo "Source directory 'www' not found."
            echo "Repository root contents:"
            ls -la
            exit 1
          fi

      # -----------------------------------------------------------------------
      # Configure Pages and upload www/ as the Pages artifact
      # -----------------------------------------------------------------------
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      # -----------------------------------------------------------------------
      # Deploy the uploaded artifact to GitHub Pages
      # -----------------------------------------------------------------------
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
