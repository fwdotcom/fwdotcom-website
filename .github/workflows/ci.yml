# -----------------------------------------------------------------------------
# CI & Code Quality Workflow für www.frankwinter.com
#
# Eigenschaften:
# - Trigger: Push und Pull Request auf den Branch "main"
# - Prüfungen:
#   1. JSON-Validierung von away.json (Syntax + Datumsschema YYYY-MM-DD)
#   2. JavaScript-Syntaxprüfung (node --check)
#   3. HTML-Validierung (HTMLHint: keine doppelten IDs/Attribute, saubere Tags)
#   4. CSS-Validierung (Stylelint: gültige Properties und Werte)
#   5. Bild-Asset-Integritätsprüfung (Prüfung aller in JS/HTML referenzierten Bilder)
# -----------------------------------------------------------------------------

name: CI & Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Code Quality & Integrity Checks
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # -----------------------------------------------------------------------
      # Repository auschecken
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Node.js Umgebung bereitstellen
      # -----------------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # -----------------------------------------------------------------------
      # 1. Validierung von away.json
      # -----------------------------------------------------------------------
      - name: Validate away.json (Syntax & Date schema)
        run: |
          node -e '
            const fs = require("fs");
            const raw = fs.readFileSync("www/away.json", "utf8");
            const data = JSON.parse(raw);
            const iso = /^\d{4}-\d{2}-\d{2}$/;
            if (!iso.test(data.from) || !iso.test(data.to)) {
              console.error("Ungültiges Datumsformat in away.json (Erwartet YYYY-MM-DD):", data);
              process.exit(1);
            }
            const from = new Date(data.from);
            const to = new Date(data.to);
            if (isNaN(from.getTime()) || isNaN(to.getTime())) {
              console.error("Ungültiges Datum in away.json:", data);
              process.exit(1);
            }
            if (to < from) {
              console.error("to-Datum darf nicht vor from-Datum liegen:", data);
              process.exit(1);
            }
            console.log("✓ away.json ist gültig:", data);
          '

      # -----------------------------------------------------------------------
      # 2. JavaScript-Syntaxprüfung
      # -----------------------------------------------------------------------
      - name: Validate JavaScript (Syntax Check)
        run: |
          node --check www/site.js
          echo "✓ JavaScript Syntax ist fehlerfrei."

      # -----------------------------------------------------------------------
      # 3. HTML-Linting (HTMLHint)
      # -----------------------------------------------------------------------
      - name: Lint HTML
        run: |
          npx --yes htmlhint "www/**/*.html"
          echo "✓ HTML Validierung erfolgreich bestanden."

      # -----------------------------------------------------------------------
      # 4. CSS-Linting (Stylelint)
      # -----------------------------------------------------------------------
      - name: Lint CSS
        run: |
          npx --yes stylelint "www/**/*.css"
          echo "✓ CSS Validierung erfolgreich bestanden."

      # -----------------------------------------------------------------------
      # 5. Bild-Asset-Integritätsprüfung
      # -----------------------------------------------------------------------
      - name: Check Referenced Asset Integrity
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");

            const js = fs.readFileSync("www/site.js", "utf8");
            const html = fs.readFileSync("www/index.html", "utf8");

            const names = new Set(
              (js + html).match(/clay_frank[a-zA-Z0-9_]*\.webp/g) || []
            );

            let missing = 0;
            for (const name of names) {
              const p1 = path.join("www", "images", name);
              const p2 = path.join("www", "images", "seasons", name);
              if (!fs.existsSync(p1) && !fs.existsSync(p2)) {
                console.error("FEHLER: Bild existiert weder in www/images noch in www/images/seasons:", name);
                missing++;
              }
            }

            if (missing > 0) {
              console.error(`Integritätsprüfung fehlgeschlagen: ${missing} Bild(er) fehlen.`);
              process.exit(1);
            }
            console.log(`✓ Alle ${names.size} referenzierten WebP-Bilder existieren.`);
          '

