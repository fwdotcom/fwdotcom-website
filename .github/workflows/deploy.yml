# -----------------------------------------------------------------------------
# Manueller Deployment-Workflow zum Deployment auf den Web Server
#
# Eigenschaften:
# - Trigger: ausschließlich manuell (workflow_dispatch)
# - Quelle: lokales Verzeichnis "www/"
# - Ziel: festes Server-Verzeichnis (Secret: DEPLOY_PATH)
# - Übertragung: rsync über SSH
# - Synchronisationsmodus: Spiegelung (inkl. Löschung entfernter Dateien)
#
# WICHTIG:
# - DEPLOY_PATH darf ausschließlich für diese Webseite verwendet werden
# - Durch --delete werden serverseitig Dateien gelöscht, die lokal nicht mehr existieren
# -----------------------------------------------------------------------------

name: Deploy on Web Server

on:
  # Manueller Start über GitHub Actions UI
  workflow_dispatch:

jobs:
  deploy:
    # GitHub-hosted Linux Runner
    runs-on: ubuntu-latest

    # Opt into Node.js 24 for actions
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # -----------------------------------------------------------------------
      # Repository auschecken
      # -----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # SSH-Konfiguration für den rsync-Deploy
      #
      # Erforderliche Secrets:
      # - SSH_PRIVATE_KEY  : privater Schlüssel des Deploy-Users
      # - SSH_KNOWN_HOSTS  : known_hosts-Eintrag des Zielservers
      # -----------------------------------------------------------------------
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # -----------------------------------------------------------------------
      # Sicherheitsprüfung: Existenz des Quellverzeichnisses
      # -----------------------------------------------------------------------
      - name: Validate source directory (www)
        run: |
          if [ ! -d "www" ]; then
            echo "Quellverzeichnis 'www' wurde nicht gefunden."
            echo "Inhalt des Repository-Root:"
            ls -la
            exit 1
          fi

      # -----------------------------------------------------------------------
      # Deployment per rsync
      #
      # Eigenschaften:
      # - Spiegelung von "www/" in das feste Server-Zielverzeichnis
      # - --delete entfernt serverseitige Dateien, die lokal nicht mehr existieren
      #
      # Erforderliche Secrets:
      # - SSH_HOST    : Hostname oder IP des Zielservers
      # - SSH_USER    : Deploy-Benutzer
      # - SSH_PORT    : SSH-Port (optional, Standard 22)
      # - DEPLOY_PATH : absolutes Zielverzeichnis auf dem Server
      # -----------------------------------------------------------------------
      - name: Deploy www/ via rsync (delete enabled)
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
          PORT: ${{ secrets.SSH_PORT }}
          DEST: ${{ secrets.DEPLOY_PATH }}
        run: |
          PORT_ARG=""
          if [ -n "${PORT}" ]; then PORT_ARG="-p ${PORT}"; fi

          # Spiegelung von www/ in das feste Server-Zielverzeichnis (inkl. Löschungen)
          rsync -az --delete -e "ssh ${PORT_ARG}" "www/" "${USER}@${HOST}:${DEST}/"
